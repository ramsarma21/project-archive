packages:
  - "packages/*"
  - "apps/*"
  - "infra"

allowBuilds:
  esbuild: true

overrides:
  # thread-stream 4.2.0 (a pino dependency) was published with a stray
  # .claude/settings.local.json inside its tarball. The agent sandbox denies
  # writes to any .claude path, so materialising it fails with EPERM and aborts
  # the install *after* node_modules has been emptied — which presents as a hang
  # rather than a failure and cost several rebuilds to diagnose. 4.1.0 is the
  # same minor without the stray file. Drop this once upstream republishes.
  thread-stream: 4.1.0

minimumReleaseAgeExclude:
  - '@aws-sdk/client-secrets-manager@3.1092.0'
  - '@aws-sdk/client-sts@3.1092.0'
  - '@aws-sdk/core@3.976.0'
  - '@aws-sdk/credential-provider-env@3.972.60'
  - '@aws-sdk/credential-provider-http@3.972.62'
  - '@aws-sdk/credential-provider-ini@3.973.5'
  - '@aws-sdk/credential-provider-login@3.972.67'
  - '@aws-sdk/credential-provider-node@3.972.71'
  - '@aws-sdk/credential-provider-process@3.972.60'
  - '@aws-sdk/credential-provider-sso@3.973.4'
  - '@aws-sdk/credential-provider-web-identity@3.972.66'
  - '@aws-sdk/nested-clients@3.997.34'
  - '@aws-sdk/token-providers@3.1092.0'
