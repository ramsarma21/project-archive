name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Concurrency, and the push-cancellation trap this encodes against.
#
# THE TRAP (observed): with `cancel-in-progress: true` for every ref, pushing to
# `main` after each merge CANCELS the still-running CI for the previous merge, so
# during a run of quick merges NO run ever completes and `main` has no green
# evidence — the played-mission gate never gets to finish. On a PR branch,
# cancelling a superseded run is correct (only the latest commit matters); on
# `main` it is exactly wrong, because every merged commit is a record that must be
# validated to completion.
#
# So: cancel superseded PR runs (saves minutes on rapid pushes to a PR), but NEVER
# cancel a `main` run — with cancel-in-progress false, consecutive `main` pushes
# QUEUE and each runs to completion instead of eating the one before it. See
# docs/process/CI-AND-BROWSER-CHECKS.md §1.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The API runs on Node 24 in production (see apps/api/Dockerfile), so CI
  # verifies against 24 rather than against whatever is newest. Local machines
  # are ahead of this on purpose; that difference is the point.
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # The gate that has to stay green: everything that runs without a database or
  # a browser. One job rather than three so the workspace is installed once;
  # every step still runs even when an earlier one fails, so a red run shows all
  # of what is broken instead of only the first failure.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads `packageManager` from
      # package.json, so this cannot drift from what developers run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --no-frozen-lockfile is deliberate and temporary. pnpm-lock.yaml is
      # currently behind the workspace (packages added this week are not in it
      # yet), and a frozen install fails outright on that, which would block
      # every unrelated change. The `lockfile` job reports the drift on its own.
      # Switch this to --frozen-lockfile once that job is green; until then CI
      # can resolve versions the lockfile does not pin.
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      # Engine/protocol packages must not import chapter content. Cheap, and it
      # is the invariant most easily broken by a hurried import.
      - name: Boundary lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # Content invariants — module length, concept-id canonicality, the PvP
      # pool composition, the duel round ceiling, the capstone readiness gate.
      # These are the quiet failures a build never otherwise catches: content
      # that ships unfair to a student while every test still passes. Placed
      # here, near the front, because it is a ~1s check that reads local files
      # and resolves its constants from source through tsx — no build, no
      # database, no network — so a broken invariant fails the run in seconds
      # rather than after the test suite.
      - name: Content verification
        if: ${{ !cancelled() }}
        run: pnpm verify:content

      # A unit is one lesson + mission + boss fight, and the owner's invariant is
      # that the fight covers everything the lesson taught. This asserts it: every
      # concept a unit's lesson deck teaches must have at least one encounter or
      # duel item in the SAME unit. It has to be blocking rather than advisory
      # because the failure is invisible and permanent — remediation reads absent
      # evidence as "teach", so a taught-but-untested concept can never produce
      # evidence, sits in the reteach set forever, and shows nothing wrong in play
      # while every other gate here stays green. Static, ~4 s, no database, no
      # browser, so it belongs beside verify:content.
      - name: Unit concept coverage (the fight covers the lesson)
        if: ${{ !cancelled() }}
        run: pnpm verify:units

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # Includes apps/api's in-memory suite, which re-hashes every file in
      # apps/api/src/migrations against checksums.json: a rewritten migration
      # fails here without needing a database.
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      # The asset pipeline is scripts rather than a workspace package, so it has
      # no package.json and `pnpm test` cannot reach it. Its unit tests were
      # therefore run only when somebody remembered to — which is how the
      # placement instruments accumulated four defects that each reported a
      # confident wrong number instead of failing. `placement_lib.test.mjs` states
      # the invariants that catch all four.
      - name: Asset pipeline unit tests
        if: ${{ !cancelled() }}
        run: node --test 'assets/pipeline/*.test.mjs'

      # The world's COLLISION and its VISIBLE MESH are produced by different steps
      # — collision authored in the level, the GLB contain-fitted into a box
      # derived from it — and nothing forced them to agree. That is how the owner
      # phased through ceilings and hit invisible walls while every invariant
      # reported zero penetrations: the invariants validate the collision, and
      # nothing validated that the SHIPPED GLB fills it. These two guards close
      # that gap, on the published bytes, and each proves it catches an offset or a
      # shrunk hull before it measures anything. Blocking, beside verify:content.
      - name: World collision vs visible mesh
        if: ${{ !cancelled() }}
        run: pnpm assets:verify:collision

      - name: M1 placement fit
        if: ${{ !cancelled() }}
        run: pnpm assets:verify:placement

      # The third of the mesh-vs-authoring guards: collision and placement above
      # ask whether the solid is drawn and whether a route surface has stone under
      # it; this asks whether the delivered mesh actually PRESENTS the affordances
      # the route was authored against — every deck, mass top, climb arrival and
      # dive catch. It carries an itemised, measured, categorised KNOWN_DEBT list
      # (22 accepted entries today) printed loudly on every run, and fails on any
      # NEW or WORSENED red: the list may shrink but must never grow silently. It
      # self-tests before it measures. Blocking, beside the other two.
      - name: World affordances (mesh presents the route's surfaces)
        if: ${{ !cancelled() }}
        run: pnpm assets:verify:affordances

      - name: Build packages
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Build web bundle
        if: ${{ !cancelled() }}
        run: pnpm --filter @pa/web build

  # ---------------------------------------------------------------------------
  # The persistence suite, which until now only ran on a machine with Docker
  # running locally. It applies every migration to a real Postgres, twice, and
  # asserts each one is applied exactly once at its recorded checksum - so
  # migration drift and non-idempotent migrations fail here.
  # ---------------------------------------------------------------------------
  api-postgres:
    name: api persistence (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine # matches docker-compose.yml
        env:
          POSTGRES_USER: project_archive
          POSTGRES_PASSWORD: project_archive
          POSTGRES_DB: project_archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_archive -d project_archive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite sets its own grading/CSRF test values; it only needs a reachable
      # database. Credentials here are the throwaway ones the service starts with.
      DATABASE_URL: postgres://project_archive:project_archive@localhost:5432/project_archive
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: API persistence suite
        run: pnpm --filter @pa/api test:postgres

  # ---------------------------------------------------------------------------
  # The played-mission gate. It is the only gate that OPENS THE GAME and plays it:
  # it drives the real client with Playwright and asserts the mission renders, the
  # route advances, every mandatory encounter arms AND resolves (no soft-lock), no
  # body penetrates solid geometry, the yard is reached, and the duel loads a graded
  # world that discriminates a right answer from a wrong one. Every gate above reads
  # source, authored data or mesh geometry; each of this morning's three regressions
  # — the duel void, the encounter soft-lock, the untextured props — passed all of
  # them while the game was visibly broken. This is the gate that catches that.
  #
  # WHY ITS OWN JOB rather than a step in `verify`. `verify` is deliberately the
  # database-free, browser-free gate that stays green in seconds; giving it a
  # Postgres service, a browser and two long-lived servers would break that contract
  # and slow the fast static feedback. A running stack is exactly what the existing
  # `api-postgres` job already models, so this follows that precedent: a
  # service-backed job with its own Postgres.
  #
  # WHY THE PORTS ARE NOT THE DEFAULTS. The duel's live attempt is a CSRF-protected
  # mutation, and the API refuses it with CSRF_INVALID unless its WEB_ORIGIN exactly
  # equals the browser's origin. On the default port the API's default origin happens
  # to match; on any other it does not, and the duel silently reports "could not open
  # a gradeable attempt" that reads like a code bug. That is the trap the owner hit
  # within minutes. Running here on non-default ports with WEB_ORIGIN pinned to the
  # web origin both provisions it correctly AND keeps that path exercised, so a
  # regression in the origin handling is caught rather than papered over by a default.
  #
  # NO BUILD STEP: every @pa/* package exports ./src/*.ts, so the web dev server
  # (vite) and the API (tsx) run straight from source. That is also why this job is
  # untouched by the packages/*/dist EPERM the sandboxed `pnpm build` can throw.
  # ---------------------------------------------------------------------------
  playthrough:
    name: playthrough (played-mission gate)
    runs-on: ubuntu-latest
    # Raised from 20 to 50 to LEARN the real CI runtime: the first tick-relative run
    # hit the 20 m cap and was cancelled mid-gate (provisioning clean, it simply did
    # not finish), so 20 was a censoring cap, not a measurement. A GitHub runner's
    # SwiftShader is far slower than the ~6 min this took under forced software WebGL
    # on a dev laptop, and the tick-relative gate waits as long as needed to accrue
    # the sim ticks — so the honest move is a generous cap, read the real figure off
    # a completed run, then tune deliberately. Do NOT shrink the tick budgets to fit
    # a cap: that tests less of the route, which is where the defects were.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine # matches docker-compose.yml and api-postgres
        env:
          POSTGRES_USER: project_archive
          POSTGRES_PASSWORD: project_archive
          POSTGRES_DB: project_archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_archive -d project_archive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Non-default ports on purpose (see the header): this keeps the WEB_ORIGIN /
      # CSRF path honest instead of relying on the default that happens to match.
      WEB_PORT: "5273"
      API_PORT: "3011"
      # The single fact that makes verdict=live gradeable off the default port: the
      # API's allowed origin must equal the origin the browser runs on, exactly.
      WEB_ORIGIN: http://127.0.0.1:5273
      VITE_API_PROXY_TARGET: http://127.0.0.1:3011
      DATABASE_URL: postgres://project_archive:project_archive@localhost:5432/project_archive
      API_HOST: 127.0.0.1
      # Loopback, http, dev sessions on (NODE_ENV is unset, so it is not production):
      # the harness opens a throwaway local session to arm a real, canonical attempt.
      COOKIE_SECURE: "false"
      # A throwaway signing secret so the API will start. Grading itself is OFF here
      # (no classifier credential), which is fine: the discrimination check uses the
      # scripted client-side verdicts, and the live stage only asserts the arena
      # RENDERS — it never submits an answer to the grader.
      GRADING_RECEIPT_SECRET: ci-throwaway-playthrough-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      # Playwright is a repo dependency, but pnpm does not run its browser-download
      # lifecycle script, so the browser is fetched explicitly. --with-deps pulls the
      # system libraries the headless browser needs on a bare runner. On Linux there
      # is no Google Chrome at the mac path the harness prefers, so it uses this one.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # server.ts does not migrate on boot, so the schema is applied before it starts;
      # the live attempt writes real progression rows and needs the tables present.
      - name: Apply migrations
        run: pnpm --filter @pa/api migrate

      # Backgrounded here and left running for the gate step; the runner is ephemeral,
      # so no teardown is needed. Each waits on a real readiness signal — the API on
      # /v1/health reporting database:true, the web on a 200 from its root — rather
      # than a fixed sleep, and fails loudly with its log if it never comes up.
      - name: Start API
        run: |
          nohup pnpm --filter @pa/api start > /tmp/pa-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${API_PORT}/v1/health" >/dev/null; then
              echo "API healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::API never became healthy"; cat /tmp/pa-api.log; exit 1
      - name: Start web dev server
        run: |
          nohup pnpm --filter @pa/web exec vite --port "${WEB_PORT}" --strictPort --host 127.0.0.1 \
            > /tmp/pa-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${WEB_PORT}/" >/dev/null; then
              echo "web up"; exit 0
            fi
            sleep 1
          done
          echo "::error::web dev server never came up"; cat /tmp/pa-web.log; exit 1

      # The gate. Blocking and unweakened: no continue-on-error, no retry, the full
      # ~95s soft-lock/timeout budget intact. A red here means the played mission is
      # broken, which is the whole point.
      - name: Played-mission gate
        run: node scripts/check-playthrough.mjs "http://127.0.0.1:${WEB_PORT}"

      # A browser gate that fails opaquely gets disabled, so on failure it leaves the
      # frame that failed: world-spawn.png / duel-live.png (or duel-live-fail.png) and
      # the route/census/grading JSON the check already writes. This is the first CI
      # job to upload an artifact; there was no prior pattern to follow.
      - name: Upload playthrough artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-out
          path: .affordwork/playthrough-out/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Advisory — but the original blocker is RESOLVED.
  #
  # This job used to be expected-to-fail because pnpm-lock.yaml described fewer
  # projects than the workspace. That is fixed: the lockfile now lists every
  # workspace importer and `pnpm install --frozen-lockfile` succeeds locally
  # (30221f7 regenerated it when @react-three/rapier was dropped). So this job
  # is now expected to PASS on the first real run.
  #
  # It is still `continue-on-error` only because no run has been observed on a
  # clean GitHub runner yet (main has never been pushed). Once the first real run
  # confirms it green: delete continue-on-error here and on `api-image`, and
  # switch the installs above from --no-frozen-lockfile to --frozen-lockfile.
  # That last switch is what makes CI reproducible; it is left for the first-run
  # confirmation so a first push cannot break on an unverified frozen install.
  # ---------------------------------------------------------------------------
  lockfile:
    name: lockfile in sync (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile

  # ---------------------------------------------------------------------------
  # Advisory, and now expected to PASS: the image installs with --frozen-lockfile
  # on purpose (a production image that resolves different versions than CI is not
  # a reproducible artifact), and the lockfile is now in sync (see `lockfile`
  # above), so the frozen install inside the Dockerfile should succeed. Kept
  # advisory only until the first real run confirms it on a clean runner; that it
  # builds at all is what nobody was checking when it silently stopped being able to.
  # ---------------------------------------------------------------------------
  api-image:
    name: api image builds (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint Dockerfile
        run: docker buildx build --check -f apps/api/Dockerfile .
      # Built for the runner's native linux/amd64 rather than the linux/arm64
      # that CDK deploys. The Dockerfile is architecture-neutral, and
      # cross-building arm64 under emulation costs several times as long for no
      # additional signal.
      - name: Build API image
        run: docker buildx build -f apps/api/Dockerfile -t pa-api:ci .
